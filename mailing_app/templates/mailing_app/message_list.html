{% extends 'base.html' %}
{% block title %}Сообщения{% endblock %}
{% block content %}
    <h1>Список сообщений</h1>
    <a href="{% url 'mailing_app:message_create' %}" class="btn btn-primary mb-3">
        Создать сообщение
    </a>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Тема письма</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for message in messages %}
                <tr>
                    <td>{{ message.subject }}</td>
                    <td>
                        <a href="{% url 'mailing_app:message_detail' message.pk %}" class="btn btn-sm btn-info">Просмотр</a>
                        <a href="{% url 'mailing_app:message_update' message.pk %}" class="btn btn-sm btn-warning">Изменить</a>
                        <a href="{% url 'mailing_app:message_delete' message.pk %}" class="btn btn-sm btn-danger">Удалить</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center">Список сообщений пуст.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
