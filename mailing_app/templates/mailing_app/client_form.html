{% extends 'base.html' %}

{% block title %}Форма клиента{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}Изменить{% else %}Создать{% endif %} клиента</h1>
    <div class="card p-4">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="{% url 'mailing_app:client_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
