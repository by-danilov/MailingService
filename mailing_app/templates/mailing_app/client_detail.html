{% extends 'base.html' %}

{% block title %}Детали клиента{% endblock %}

{% block content %}
    <h1>Детали клиента: {{ object.email }}</h1>
    <div class="card p-4">
        <p><strong>ФИО:</strong> {{ object.full_name }}</p>
        <p><strong>Комментарий:</strong> {{ object.comment|default:"—" }}</p>
        <hr>
        <a href="{% url 'mailing_app:client_update' object.pk %}" class="btn btn-warning me-2">Изменить</a>
        <a href="{% url 'mailing_app:client_delete' object.pk %}" class="btn btn-danger me-2">Удалить</a>
        <a href="{% url 'mailing_app:client_list' %}" class="btn btn-secondary">Назад к списку</a>
    </div>
{% endblock %}
